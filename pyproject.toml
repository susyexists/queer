[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queer"
version = "1.4.1"
description = "Native electronic responses, crystal, atomistic and Hamiltonian workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "QUEER Development Team", email = "susy@materials.wiki"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "joblib>=1.3", "threadpoolctl>=3.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/susyexists/queer"

[project.scripts]
queer = "queer.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.8", "pandas>=2.1"]
symmetry = ["spglib>=2.5"]
mace = ["torch>=2.2", "mace-torch>=0.3"]
hamgnn = ["torch>=2.2", "torch-geometric>=2.5"]
animation = ["imageio[ffmpeg]>=2.31", "pillow>=10"]
precision = ["mpmath>=1.3"]
acceleration = ["numba>=0.61"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.9", "nbformat>=5.9"]
all = ["queer[plot,symmetry,animation,notebook]"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.15", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
queer = ["resources/*.mplstyle", "resources/symmetry/*", "finite_field/SOURCE_MANIFEST.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "notebook: execution of supported notebook",
  "hpc: real cluster acceptance",
  "packaging: isolated distribution acceptance",
  "paper: finite-field paper reference anchors and digitized maps",
  "slow: convergence and independent time-domain acceptance",
  "precision: optional extended-precision numerical acceptance",
]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["scripts/archive", "scripts/figures", "notebooks/archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = [
  "src/queer/_generator_boot.py",
  "src/queer/_build.py",
  "src/queer/physics",
  "src/queer/workflows",
  "src/queer/models/contracts.py",
  "src/queer/models/evaluation.py",
  "src/queer/io/numerical.py",
  "src/queer/io/results.py",
  "src/queer/observables/checkpoints.py",
  "src/queer/observables/convergence.py",
  "src/queer/observables/_sampling.py",
  "src/queer/observables/_response_common.py",
  "src/queer/capabilities.py",
  "src/queer/config.py",
  "src/queer/execution.py",
  "src/queer/io/artifacts.py",
  "src/queer/io/openmx.py",
  "src/queer/io/pao.py",
  "src/queer/models/openmx.py",
  "src/queer/observables/_tb.py",
  "src/queer/observables/electronic.py",
  "src/queer/observables/geometry.py",
  "src/queer/observables/integrated.py",
  "src/queer/observables/nonlinear.py",
  "src/queer/observables/optical.py",
  "src/queer/observables/result.py",
  "src/queer/observables/surface.py",
  "src/queer/observables/transport.py",
  "src/queer/observables/unfolding.py",
  "src/queer/plotting/finite_field.py",
  "src/queer/structures.py",
