  "src/queer/io/atomistic.py",
  "src/queer/io/bands.py",
  "src/queer/io/calculations.py",
  "src/queer/io/hamiltonian.py",
  "src/queer/io/records.py",
  "src/queer/models/graph.py",
  "src/queer/observables/integration.py",
  "src/queer/atomistic/dynamics.py",
  "src/queer/atomistic/phonons.py",
  "src/queer/atomistic/selection.py",
  "src/queer/atomistic/datasets.py",
  "src/queer/atomistic/metrics.py",
  "src/queer/adapters/mace.py",
