[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queer"
version = "1.1.0"
description = "Reproducible Wannier Hamiltonian and electron-phonon workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "QUEER Development Team", email = "susy@materials.wiki"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "joblib>=1.3", "threadpoolctl>=3.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/susyexists/queer"

[project.scripts]
queer = "queer.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.8", "pandas>=2.1", "ase>=3.23"]
symmetry = ["seekpath>=2.1"]
animation = ["imageio[ffmpeg]>=2.31", "pillow>=10"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.9", "nbformat>=5.9"]
all = ["queer[plot,symmetry,animation,notebook]"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.15", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
queer = ["resources/*.mplstyle", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["notebook: execution of supported notebook", "hpc: real cluster acceptance", "packaging: isolated distribution acceptance"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["scripts/archive", "scripts/figures", "notebooks/archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/queer/config.py", "src/queer/execution.py", "src/queer/io/artifacts.py"]
