# Declarative ownership index. Units and adapter conventions are part of each equation.
schema_version = 1

[[equations]]
id = "geometry.reciprocal"
expression = "B = 2*pi*A^(-T); k_cart = k_frac*B"
input_units = "A: angstrom; k_frac: dimensionless"
output_units = "B and k_cart: inverse angstrom"
assumptions = ["Nonsingular direct lattice with row vectors"]
conventions = ["A*B^T = 2*pi*I; input reciprocal basis is retained"]
canonical = "queer.geometry.lattice:reciprocal_lattice"
specialized_backends = []
source_references = ["docs/scientific_conventions.md#scientific-contracts"]
independent_tests = ["tests/numerical/test_geometry.py::test_nonorthogonal_coordinate_convention_and_legacy_modern_pair"]

[[equations]]
id = "electronic.fourier_hamiltonian"
expression = "H(k) = sum_R H_normalized(R)*exp(2*pi*i*k_frac.R)"
input_units = "H_normalized: eV; R: integer lattice translations; k_frac: dimensionless"
output_units = "eV"
assumptions = ["HR degeneracies and pair-specific WS images are normalized before summation"]
conventions = ["Positive Fourier phase; standard, ws_distance and ndegen_applied are explicit modes"]
canonical = "queer.physics.operators:assemble"
specialized_backends = ["queer.models.wannier:WannierModel._fourier_values", "queer.models.openmx:OpenMXModel._fourier"]
source_references = ["docs/scientific_conventions.md#scientific-contracts", "https://wannier90.readthedocs.io/en/latest/user_guide/wannier90/files/"]
independent_tests = ["tests/numerical/test_wannier.py::test_complex_chain_phase_degeneracy_and_fermi_reference", "tests/numerical/test_wannier_scaling.py::test_compact_ws_scatter_matches_independent_image_sum"]

[[equations]]
id = "electronic.ws_distance_images"
expression = "H_ws(R+T)_ij += H(R)_ij/(deg(R)*N_ij(R)) for every T = n*mp_grid with |(R+T).A + tau_j - tau_i| within tol of the nearest image; N_ij(R) counts those T"
input_units = "H: eV; A, tau and tol: angstrom; R, n and mp_grid: integers"
output_units = "eV"
assumptions = ["Centres are the Cartesian Wannier centres as written, not wrapped into the home cell", "The integer search cube is certified to contain every nearest image"]
conventions = ["H(R)_ij = <i,0|H|j,R>; tied images share a hop evenly; wsvec file images in file mode leave pairs absent from the file at T = 0"]
canonical = "queer.io.wannier_ws:recompute_wsvec"
specialized_backends = ["queer.io.wannier_ws:PackedWignerSeitzShifts.normalized_operator_arrays", "queer.io.wannier_ws:unfold_from_wsvec"]
source_references = ["docs/generator_services.md#wannier90-inputs-of-the-pythtb-engine", "https://raw.githubusercontent.com/wannier-developers/wannier90/v3.1.0/src/ws_distance.F90"]
independent_tests = ["tests/numerical/test_wannier_ws_images.py::test_ws_images_match_independent_search_for_oblique_cell_with_off_centre_orbitals", "tests/numerical/test_wannier_ws_recompute.py::test_generic_k_hamiltonian_against_independent_exhaustive_image_sum"]

[[equations]]
id = "electronic.table_hermitization"
expression = "H_avg(R) = (H(R) + H(-R)^dagger)/2; |E_n[H_avg](k) - E_n[H_pair](k)| <= sum_(R = 0 or R > 0) ||H(-R)^dagger - H(R)||_F"
input_units = "H: eV; R: integer lattice translations"
output_units = "eV"
assumptions = ["Weyl's inequality for Hermitian matrices bounds every eigenvalue shift", "H_pair keeps the lexicographically positive half and the upper R = 0 triangle with their conjugates and a real diagonal"]
conventions = ["H(R)_ij = <i,0|H|j,R>; a block without its partner adds its adjoint and counts its norm, twice in the negative half; cutoffs act after averaging"]
canonical = "queer.physics.operators:hermitize_table"
specialized_backends = ["queer.physics.operators:table_hermiticity", "queer.models.wannier:WannierModel.from_table"]
source_references = ["docs/scientific_conventions.md#scientific-contracts"]
independent_tests = ["tests/numerical/test_wannier_table.py::test_weyl_bound_covers_averaged_against_one_of_each_pair_eigenvalues", "tests/numerical/test_wannier_table.py::test_averaging_hermitizes_a_non_hermitian_table"]

[[equations]]
id = "electronic.vacuum_fold"
expression = "H_fold(R_p) = sum_(R_v) H(R_p, R_v); H_fold(k_p) = H(k_p, k_v = 0)"
input_units = "H: eV; R: integer lattice translations"
output_units = "eV"
assumptions = ["Periodic axes are those with a nonzero translation in the table as written, before WS images"]
conventions = ["Folded translations are lexicographically ordered; trailing operator axes fold identically"]
canonical = "queer.io.wannier_ws:fold_vacuum_axes"
specialized_backends = []
source_references = ["docs/generator_services.md#wannier90-inputs-of-the-pythtb-engine"]
independent_tests = ["tests/numerical/test_wannier_ws_images.py::test_thick_slab_ws_routes_hops_through_vacuum_and_folding_restores_the_layer_model", "tests/numerical/test_wannier_ws_images.py::test_fold_keeps_unfolded_tables_and_trailing_operator_axes"]

[[equations]]
id = "electronic.centered_pair_gap"
expression = "(H-E_ref*S)*C = S*C*epsilon; gap = epsilon_c-epsilon_v"
