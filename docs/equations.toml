[[equations]]
id = "response.bcp_dipole_nonlinear_hall"
expression = "M_abc(mu, T) = sum_n int [dk] (-f'(E_n - mu)) v_a(n) G_bc(n), BCD_a = sum_n int [dk] (-f') v_a Omega, sigma_xy = -(e^2/h)(1/2pi) sum_n int d^2k f Omega (plus the always-occupied bands), DOS = sum_n int (-f') /A_BZ, D_ab = sum_n int [dk] (-f') v_a v_b, with [dk] = d^2k/(2 pi)^2; T = 0 from the triangle rules at mu, T > 0 by the exact identity sum int f X = int dmu' (-f') Theta(mu') on a kT/20 grid; chi_abc = -(e^3/hbar)[c_out M_abc + c_in (M_bac + M_cab)] for (c_out, c_in) = (1, -1/2), (2, -1/2), (1/2, -1); A3 = |alpha + i beta|, alpha = (M_xxx - M_xyy - 2 M_yxy)/4, beta = (M_yxx + 2 M_xxy - M_yyy)/4, theta0 = atan2(beta, alpha)/3; C = int Omega_S/2pi and K_in = int g_S,in/2pi of the occupied manifold when its gap is open"
input_units = "v: eV angstrom; G: angstrom^2/eV; Omega: angstrom^2; mu, kT: eV"
output_units = "M: angstrom/eV; BCD: angstrom; sigma_xy: e^2/h; DOS: states/eV/cell; D: eV; chi: mA nm/V^2"
assumptions = ["The zone integrals are taken on a Gamma-centred quadtree of triangles: the must-split rules (seeds, small gaps with large interband velocity, band edges), then refinement by each cell's centre rule against its corner rule until every controlled quantity is within the tolerance, and again to half of it", "The integration stops at max_points vertices (budget), past a deadline (time) or, in a replay, at stop_vertices vertices (time); without a deadline the vertex set depends only on the inputs"]
conventions = ["G and M drop out-of-W partners; K is an in-W lower bound", "The three chi conventions predict 0, -1 and +1.5 (e^3/hbar) M for a C3 film, so all three are reported"]
canonical = "queer.observables.qgeom:adaptive_response"
specialized_backends = ["queer.observables.qgeom:Integrator.must_split", "queer.observables.qgeom:Integrator.refine", "queer.observables.qgeom:Integrator.snapshot", "queer.observables.qgeom:Integrator.smeared_check", "queer.observables.qgeom:occupation_pass", "queer.observables.qgeom:dipole_sources", "queer.observables.qgeom:uniform_response", "queer.observables.qgeom:nonlinear_hall_response", "queer.physics.qgeom:curves_from_integrals", "queer.physics.qgeom:chi_all_conventions", "queer.physics.qgeom:trigonal"]
source_references = ["docs/generator_services.md#quantum-geometry-of-the-pythtb-engine", "https://doi.org/10.1103/PhysRevLett.112.166601", "https://doi.org/10.1103/PhysRevB.108.L201405"]
independent_tests = ["tests/numerical/test_qgeom_physics.py::test_the_adaptive_integral_gives_the_haldane_chern_number_and_hall_plateau", "tests/numerical/test_qgeom_physics.py::test_the_adaptive_thermal_integrals_meet_a_fine_uniform_grid", "tests/numerical/test_qgeom_physics.py::test_the_trigonal_amplitude_rotates_with_three_times_the_angle", "tests/numerical/test_qgeom_ports.py::test_adaptive_response_equals_the_kernel", "tests/numerical/test_qgeom_ports.py::test_a_replayed_time_stop_reproduces_the_kernel_stopped_by_its_clock"]
