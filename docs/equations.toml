[[equations]]
id = "topology.wilson_loop_chern"
expression = "phi(t) = -Im ln det prod_i U(k_i, k_(i+1)); C = -(1/(2*pi))*sum_j wrap(phi(t_(j+1)) - phi(t_j)), the last step closing on t_0"
